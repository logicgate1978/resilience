provider: azure
engine: chaos_studio

# Replace these placeholders before running against Azure.
subscription_id: 00000000-0000-0000-0000-000000000000
resource_group: rg-resilience-test
location: eastus

services:
- name: vm
  action: stop
  description: Shut down the first VM through Azure Chaos Studio.
  target:
    resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-resilience-test/providers/Microsoft.Compute/virtualMachines/vm-resilience-01
  parameters:
    duration: PT5M
    abruptShutdown: false

- name: vm
  action: redeploy
  description: Redeploy the second VM after the shutdown action completes.
  start_after: vm:stop
  target:
    resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-resilience-test/providers/Microsoft.Compute/virtualMachines/vm-resilience-02

- name: vm
  action: shutdown
  description: Shut down the third VM after the redeploy action completes.
  start_after: vm:redeploy
  target:
    resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-resilience-test/providers/Microsoft.Compute/virtualMachines/vm-resilience-03
  parameters:
    duration: PT5M
    abruptShutdown: false
