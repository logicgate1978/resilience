provider: azure
engine: chaos_studio

# Replace these placeholders before running against Azure.
subscription_id: 56d222cf-9c2d-415a-beb7-c1d8bb317df2
resource_group: test-rg
location: southeastasia

services:
- name: vm
  action: stop
  description: Shut down the first VM through Azure Chaos Studio.
  target:
    resource_id: /subscriptions/56d222cf-9c2d-415a-beb7-c1d8bb317df2/resourceGroups/test-rg/providers/Microsoft.Compute/virtualMachines/test-vm-01
  parameters:
    duration: PT2M
    abruptShutdown: false

- name: vm
  action: redeploy
  description: Redeploy the second VM after the shutdown action completes.
  start_after: vm:stop
  target:
    resource_id: /subscriptions/56d222cf-9c2d-415a-beb7-c1d8bb317df2/resourceGroups/test-rg/providers/Microsoft.Compute/virtualMachines/test-vm-01

observability:
  start_before: 2
  stop_after: 3
  azure_monitor:
    enabled: true